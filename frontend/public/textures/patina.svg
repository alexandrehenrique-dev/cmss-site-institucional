<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="none">
  <defs>
    <filter id="wear" x="-30%" y="-50%" width="160%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .016" numOctaves="4" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="ochre"><stop stop-color="#b77b2e" stop-opacity=".7"/><stop offset=".58" stop-color="#d7a759" stop-opacity=".48"/><stop offset="1" stop-color="#f0dcaf" stop-opacity="0"/></radialGradient>
    <radialGradient id="cream"><stop stop-color="#fff5d9" stop-opacity=".96"/><stop offset=".56" stop-color="#f2deb4" stop-opacity=".65"/><stop offset="1" stop-color="#e8c88c" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#wear)">
    <ellipse cx="0" cy="510" rx="350" ry="300" fill="url(#cream)"/>
    <ellipse cx="1170" cy="580" rx="380" ry="290" fill="url(#cream)"/>
    <ellipse cx="80" cy="280" rx="220" ry="230" fill="url(#ochre)"/>
    <ellipse cx="1180" cy="50" rx="300" ry="180" fill="url(#ochre)"/>
    <ellipse cx="540" cy="-40" rx="540" ry="160" fill="url(#cream)"/>
    <ellipse cx="480" cy="660" rx="620" ry="200" fill="url(#ochre)"/>
  </g>
</svg>
